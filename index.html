<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Família Forte PPV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0c121c; --card:#1a2332; --card2:#141c29; --gold:#d2bc8f; --gold-h:#e6d0a3; --txt:#ffffff;
    --muted:#9aa4b5; --line:rgba(210,188,143,.25);
    --f1:#3b82f6; --f2:#10b981; --f3:#f59e0b; --f4:#8b5cf6; --f5:#ef4444; --f6:#ec4899;
    --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --display:"Playfair Display",Georgia,serif; --body:"Montserrat","Segoe UI",system-ui,sans-serif;
  }
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:14px;line-height:1.55;padding-block:0 48px}
  *{box-sizing:border-box}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,18,28,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column}
  .brand b{font-family:var(--display);font-size:22px;color:var(--gold);font-weight:600}
  .brand small{color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-size:10.5px}
  .count{display:flex;gap:10px;align-items:center}
  .count .n{font-family:var(--display);font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
  .count .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;line-height:1.2}
  .ig{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;text-decoration:none}
  .ig:hover{background:var(--gold);color:var(--bg)}
  .ig svg{width:16px;height:16px}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font:600 12.5px var(--body);cursor:pointer;white-space:nowrap}
  nav.tabs button:hover{color:var(--txt)}
  nav.tabs button[aria-selected=true]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold-h);outline-offset:2px}
  section.view{padding-block:24px 0}
  h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
  h2{font-size:26px;color:var(--gold)}
  h3{font-size:18px;color:var(--gold)}
  p{margin:0}
  .lead{color:var(--muted);max-width:70ch;margin-top:6px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:18px;position:relative}
  .card.soft{border:1px solid var(--line)}
  .card.flat{border-color:transparent;background:var(--card2)}
  .kpi .v{font-family:var(--display);font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.05}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-top:6px}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:600}
  .mt{margin-top:22px}.mt2{margin-top:36px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--txt)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
  .tl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .tl .ph{background:var(--card2);border-top:4px solid var(--c);border-radius:8px;padding:12px;min-height:130px;display:flex;flex-direction:column;gap:4px}
  .tl .ph.now{outline:2px solid var(--gold);outline-offset:2px}
  .tl .ph b{font-family:var(--display);font-size:16px;color:var(--txt)}
  .tl .ph .d{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
  .tl .ph p{font-size:12.5px;color:var(--muted)}
  .tl .ph .pg{margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  @media (max-width:820px){.tl{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:480px){.tl{grid-template-columns:1fr}}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .filters button,.sbtn{background:var(--card2);border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:999px;font:600 12px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .filters button[aria-pressed=true]{color:var(--txt);border-color:var(--gold);background:var(--card)}
  .sbtn:hover{color:var(--txt);border-color:var(--gold)}
  .day{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
  .day.today{border:2px solid var(--gold)}
  .day header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card2);flex-wrap:wrap}
  .day header b{font-family:var(--display);font-size:17px;color:var(--gold);min-width:150px}
  .day header .ph-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted)}
  .day header .mark{font-size:12.5px;color:var(--txt)}
  .day header .pg{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .task{display:grid;grid-template-columns:22px 4px 1fr auto;gap:12px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.05);align-items:start}
  .task input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold);margin-top:2px;cursor:pointer}
  .task .stripe{width:4px;border-radius:2px;background:var(--c);align-self:stretch;min-height:22px}
  .task .t{font-weight:600}
  .task.done .t{color:var(--muted);text-decoration:line-through}
  .task .s{color:var(--muted);font-size:13px;margin-top:2px}
  .task .who{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
  .task .rule{font-size:12px;color:var(--gold-h);margin-top:4px;padding-left:10px;border-left:2px solid var(--line)}
  .task .note{font-size:12.5px;color:var(--txt);margin-top:6px;background:rgba(210,188,143,.08);border-radius:6px;padding:6px 10px}
  .task .note b{color:var(--gold)}
  .ed{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;font:600 11px var(--body);cursor:pointer;white-space:nowrap}
  .ed:hover{color:var(--gold);border-color:var(--gold)}
  .card .ed.corner{position:absolute;top:10px;right:10px}
  .addrow{padding:8px 16px;border-top:1px solid rgba(255,255,255,.05)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);text-align:left;padding:10px 12px;background:var(--card2);white-space:nowrap}
  td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.05);vertical-align:top}
  td.n{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  td b{color:var(--txt)}
  td .s,li .s{color:var(--muted);font-size:12.5px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.07);color:var(--txt);white-space:nowrap}
  ul.plain{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
  ul.plain li{padding-left:16px;position:relative}
  ul.plain li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
  ul.plain li .s{display:block}
  .quote{font-family:var(--display);font-size:19px;color:var(--gold);line-height:1.35;border-left:3px solid var(--gold);padding-left:14px}
  .obj{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
  .obj .q{color:var(--bad);font-weight:600}
  @media (max-width:600px){.obj{grid-template-columns:1fr}}
  .dayplan{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
  .block{display:grid;grid-template-columns:minmax(96px,max-content) 1fr;gap:6px 14px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
  .block .h{white-space:nowrap}
  @media (max-width:520px){.block{grid-template-columns:1fr}.block .h{white-space:normal}}
  .block .h{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
  .funil{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  @media (max-width:820px){.funil{grid-template-columns:1fr}}
  .funil .card{border-top:6px solid var(--c)}
  .funil .card h3{color:var(--txt);font-size:20px}
  .funil .card .sub{color:var(--c);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .field{display:grid;gap:4px}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .field input,.field textarea,.field select{background:#fff;color:var(--bg);border:2px solid var(--gold);border-radius:8px;padding:9px 12px;font:500 14px var(--body);width:100%}
  .field input::placeholder,.field textarea::placeholder{color:#6b7280}
  .btn{background:var(--gold);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font:700 13.5px var(--body);cursor:pointer}
  .btn:hover{background:var(--gold-h)}
  .btn.ghost{background:#4b5563;color:#fff}
  .btn.danger{background:var(--bad);color:#fff}
  .status{font-size:12px;color:var(--muted)}
  .sync{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .sync .dot{background:var(--warn)}
  .sync.on .dot{background:var(--ok)}
  .me{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .me input{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 8px;font:600 12px var(--body);width:110px}
  .toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:60}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .md{background:var(--card);border:2px solid var(--gold);border-radius:14px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;display:grid;gap:12px}
  .md h3{font-size:20px}
  .md .hint{font-size:12px;color:var(--muted)}
  .md textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
  /* log */
  .log{display:grid;gap:0;margin-top:12px;border-left:2px solid var(--line);padding-left:16px}
  .log .it{position:relative;padding:10px 0 14px}
  .log .it::before{content:"";position:absolute;left:-22px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--gold));border:2px solid var(--bg)}
  .log .when{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .log .tt{font-weight:600;margin-top:2px}
  .log .nt{color:var(--txt);margin-top:4px;font-size:13.5px}
  .log .nt.empty{color:var(--muted);font-style:italic}
  .task .t,.task .s,.task .rule,.task .note,td,li,.log .nt,.tl .ph p,.quote,.card p{overflow-wrap:anywhere}
  @media (max-width:640px){
    body{font-size:13.5px}
    header.top{position:static}
    .top .wrap{gap:10px}
    .brand b{font-size:19px}
    .brand small{font-size:9.5px;letter-spacing:.8px}
    .count .n{font-size:24px}
    .ig{padding:5px 10px;font-size:11.5px}
    .me input{width:90px}
    h2{font-size:22px}
    .card{padding:14px}
    .day header b{min-width:0}
    .day header .pg{margin-left:0}
    .task{grid-template-columns:22px 4px 1fr auto;gap:8px;padding:10px 12px}
    .task .who{letter-spacing:.6px}
    .card .ed.corner{top:8px;right:8px}
    .md{padding:14px;max-height:94vh}
    .kpi .v{font-size:28px}
    .tl .ph{min-height:0}
    .quote{font-size:16px}
    .funil .card h3{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <b id="brandName">Família Forte — O Começo</b>
      <small>Painel de orquestração · Dra. Paula Campozandória · imersão online paga · 07 e 08/11</small>
    </div>
    <div class="row">
      <a class="ig" href="https://www.instagram.com/paulacampozandoria/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>@paulacampozandoria</a>
      <span class="me">Você: <input id="meName" placeholder="seu nome"></span>
      <span class="sync" id="sync"><i class="dot"></i><span id="syncTxt">Sincronizando…</span></span>
      <div class="count"><span class="n" id="cd">—</span><span class="l">dias até<br>07/11</span></div>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div>
</header>

<main class="wrap">
  <section class="view" id="v-visao" role="tabpanel"></section>
  <section class="view" id="v-cronograma" role="tabpanel" hidden></section>
  <section class="view" id="v-funil" role="tabpanel" hidden></section>
  <section class="view" id="v-reguas" role="tabpanel" hidden></section>
  <section class="view" id="v-trafego" role="tabpanel" hidden></section>
  <section class="view" id="v-imersao" role="tabpanel" hidden></section>
  <section class="view" id="v-narrativa" role="tabpanel" hidden></section>
  <section class="view" id="v-decisoes" role="tabpanel" hidden></section>
</main>
<div id="modal"></div>

<script>
/* ============ CONSTANTES ============ */
const EVENT=new Date(2026,10,7);
const FRONTS={
  cont:{n:"Conteúdo & Lives",c:"var(--f1)",who:"Paula + conteúdo"},
  traf:{n:"Tráfego",c:"var(--f2)",who:"Time de tráfego"},
  copy:{n:"Copy & E-mail",c:"var(--f3)",who:"Copy"},
  wa:{n:"WhatsApp API",c:"var(--f4)",who:"Operação / API"},
  tech:{n:"Páginas & Ferramentas",c:"var(--f5)",who:"Gestão / técnico"},
  ev:{n:"Evento & Oferta",c:"var(--f6)",who:"Paula + Jez + gestão"}
};
const PHASES=[
  {id:"prep",n:"Preparação",d:"28/09 → 04/10",from:"2026-09-28",to:"2026-10-04",c:"var(--f5)",goal:"Semana 28/09 → 04/10: páginas, checkout do ingresso, API oficial aprovada, criativos e programação — tudo pronto antes da captação abrir em 05/10."},
  {id:"ato1",n:"Ato 1 — O espelho",d:"05/10 → 14/10",from:"2026-10-05",to:"2026-10-14",c:"var(--f1)",goal:"Reconhecimento: “Ela está falando da minha casa.” Lote 1 do ingresso aberto (R$ 27,90)."},
  {id:"ato2",n:"Ato 2 — A descoberta",d:"15/10 → 25/10",from:"2026-10-15",to:"2026-10-25",c:"var(--f3)",goal:"Quebra de crença: “Talvez eu esteja resolvendo do jeito errado.” Virada para o Lote 2."},
  {id:"ato3",n:"Ato 3 — O futuro possível",d:"26/10 → 06/11",from:"2026-10-26",to:"2026-11-06",c:"var(--f2)",goal:"Esperança concreta: provas, antes/depois. Convite intensifica. Lote 3 e última chamada."},
  {id:"ato4",n:"Ato 4 — Imersão + Oferta",d:"07/11 → 13/11",from:"2026-11-07",to:"2026-11-13",c:"var(--f6)",goal:"Dois dias que organizam tudo → Família Forte 2.0 vitalício (Black Friday antecipada) → fechamento e debrief."}
];
const DOW=["dom","seg","ter","qua","qui","sex","sáb"];
const pad=n=>String(n).padStart(2,"0");
const K=(m,d)=>`2026-${pad(m)}-${pad(d)}`;
const kd=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const fmtK=k=>`${k.slice(8,10)}/${k.slice(5,7)}`;
const addDays=(k,n)=>{const d=kd(k);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

/* ============ CONTEÚDO PADRÃO (tudo editável) ============ */
const CONTENT_V=5;
function defaultContent(){
  const tasks=[];let n=0;
  const add=(k,f,t,s,r)=>tasks.push({id:"t"+(n++),k,f,t,s:s||"",r:r||""});
  /* PREPARAÇÃO */
  add(K(9,28),"ev","Bater o nome definitivo da imersão","Provisório: Família Forte — O Começo. Validar junto à promessa e à identidade visual antes de gravar qualquer peça.","Nome simples, humano, familiar, ligado à ideia de construção. Nada digital/técnico.");
  add(K(9,28),"ev","Definir os 3 lotes do ingresso","Lote 1 = R$ 27,90. Preço e data de virada dos lotes 2 e 3 — registrar em Decisões.","Sugestão: virar lote junto com a virada de ato (15/10 e 26/10).");
  add(K(9,28),"cont","Mapear o funil de conteúdo da Paula (topo → meio → fundo)","Ela já produz vídeos virais: definir quais formatos são topo (viral/descoberta), meio (lives, cortes, e-mail, WhatsApp) e fundo (página, remarketing, oferta). Registrar na aba Funil.","Cada peça precisa responder: em qual ato estamos e qual conclusão a mãe precisa ter.");
  add(K(9,28),"tech","Preencher Raio X + Nicho, Avatar e Roma","Avatar: mãe cristã, casada, 30–45, filhos de 2 a 10, trabalha fora. Roma DSA: 'uma família com direção'.","Rotina da planilha antecipada para a semana 0.");
  add(K(9,29),"ev","Fechar a oferta do ingresso","Nome, o que os 2 dias entregam, bônus de quem compra no Lote 1, garantia. Preencher Oferta — Visão Geral.","A imersão não é 'curso de birra' nem palestra longa.");
  add(K(9,29),"ev","Fechar a oferta do Família Forte 2.0","Preço vitalício da Black Friday antecipada, entregáveis, bônus, garantia, prazo do carrinho.","A narrativa não pode depender do desconto.");
  add(K(9,29),"tech","Criar página de vendas do ingresso + checkout","Copy na linguagem da mãe (zero técnica). Preço do lote atual visível, próximo lote anunciado.","Aqui a conversão é COMPRA, não lead.");
  add(K(9,29),"tech","Criar página de obrigado da compra","'Você vai receber uma mensagem no WhatsApp agora' + botão salvar contato. Sem link de grupo.","");
  add(K(9,30),"wa","Conta WhatsApp Business API oficial pronta","Número dedicado, verificação Meta, nome 'Família Forte', foto e descrição. Escolher provedor (BSP).","Sem grupos e sem Joinzap: mensagens 1:1 pela API.");
  add(K(9,30),"wa","Enviar templates de aquecimento para aprovação da Meta","Boas-vindas + pesquisa, faltam 7/4/1 dias, instruções, nutrição por ato.","Aprovação leva de horas a 48h; aprovados até 03/10. Template reprovado = disparo bloqueado.");
  add(K(9,30),"wa","Integrar checkout → disparo automático","Webhook 'compra aprovada' dispara boas-vindas na hora. Testar com compra real e estornar.","");

const $=s=>document.querySelector(s);
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let C=lsGet("ff_content");if(!C||C.v!==CONTENT_V)C=defaultContent();
let S=lsGet("ff_tasks")||{};      // status: {id:{done,at,who,note}}
let DEC=lsGet("ff_dec")||{};      // decisões
let LOG=lsGet("ff_log")||[];      // registros manuais

let me=lsGet("ff_me")||"";
$("#meName").value=me;$("#meName").onchange=e=>{me=e.target.value.trim();lsSet("ff_me",me);};

const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const phaseOfK=k=>PHASES.find(p=>k>=p.from&&k<=p.to);
const progress=list=>{const n=list.length,d=list.filter(t=>S[t.id]&&S[t.id].done).length;return{n,d,p:n?Math.round(d/n*100):0}};
const sortedTasks=()=>C.tasks.slice().sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);

async function persist(what){
  if(what==="content")lsSet("ff_content",C);if(what==="tasks")lsSet("ff_tasks",S);if(what==="dec")lsSet("ff_dec",DEC);if(what==="log")lsSet("ff_log",LOG);
  const ref=refs[what];if(!ref)return;
  const body=what==="content"?C:what==="tasks"?{tasks:S}:what==="dec"?DEC:{items:LOG};
  try{await ref.set(body);}catch(e){if(e&&e.code==="invalid_argument"){canWrite=false;setSync(false,"Somente leitura");}else setSync(false,"Salvo só aqui");}
}

function feed(){
  const items=[];
  C.tasks.forEach(t=>{const st=S[t.id];if(st&&st.done)items.push({at:st.at||"",who:st.who,t:t.t,note:st.note,c:(FRONTS[t.f]||FRONTS.ev).c,k:t.k,kind:"tarefa"})});

    ${keys.map(k=>{const d=kd(k),ph=phaseOfK(k),pr=progress(byDay[k]);return `<div class="day ${k===tk?'today':''}" id="d-${k}"><header><b>${DOW[d.getDay()]} · ${fmtK(k)}</b>${ph?`<span class="ph-tag" style="color:${ph.c}">${ph.n}</span>`:""}${C.marks[k]?`<span class="mark">★ ${esc(C.marks[k])}</span>`:""}<span class="pg">${pr.d}/${pr.n}</span></header>${byDay[k].map(taskRow).join("")}${canWrite?`<div class="addrow"><button class="sbtn" data-add="${k}">+ tarefa em ${fmtK(k)}</button></div>`:""}</div>`}).join("")}`;
  $("#v-cronograma .filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.f){filt.f=b.dataset.f}else if(b.dataset.only){filt.only=!filt.only}else if(b.dataset.go){const el=document.getElementById("d-"+tk)||document.querySelector(".day");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}else if(b.dataset.addany){openTask(null);return}else if(b.dataset.sec){openSec(b.dataset.sec);return}
    lsSet("ff_filt",filt);renderCron();};
}

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

/* eventos delegados */
document.addEventListener("change",e=>{
  const cb=e.target;if(!cb.matches||!cb.matches("input[type=checkbox][data-id]"))return;
  const id=cb.dataset.id;
  if(cb.checked){openDone(id,cb);}else{S[id]={done:false,at:new Date().toISOString(),who:me};persist("tasks");renderAll();}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.sec&&!b.closest(".filters")){openSec(b.dataset.sec)}
  else if(b.dataset.edit){openTask(b.dataset.edit)}
  else if(b.dataset.add){openTask(null,b.dataset.add)}
  else if(b.dataset.dellog){if(confirm("Remover este registro?")){LOG=LOG.filter(l=>l.id!==b.dataset.dellog);persist("log");renderAll();}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function setSync(on,txt){$("#sync").classList.toggle("on",on);$("#syncTxt").textContent=txt;}

/* boot */
renderTabs();renderAll();showTab();
const API="/api/state";
async function makeStore(){
  const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(db){return {kind:"claude",label:"Compartilhado com a equipe",doc(n){const r=db.doc("state/"+n);return {set:d=>r.set(d),onSnapshot:(cb,err)=>r.onSnapshot(s=>cb(s.exists?s.data():null),err)};}};}
  try{
    const r=await fetch(API+"?doc=ping",{cache:"no-store"});
    if(r.ok){return {kind:"netlify",label:"Compartilhado (Netlify)",doc(n){let last;return {
      async set(d){last=JSON.stringify(d);const res=await fetch(API+"?doc="+n,{method:"PUT",headers:{"content-type":"application/json"},body:last});if(!res.ok)throw{code:res.status===403?"invalid_argument":"unavailable"};},
      onSnapshot(cb,err){const tick=async()=>{try{const res=await fetch(API+"?doc="+n,{cache:"no-store"});if(!res.ok)return;const j=await res.json();const str=JSON.stringify(j.data);if(str!==last){last=str;cb(j.data);}}catch(e){}};tick();const id=setInterval(tick,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});return ()=>clearInterval(id);}
    };}};}
  }catch(e){}
  return null;
}
(async()=>{
  const store=await makeStore();
  if(!store){setSync(false,"Só neste dispositivo");return;}
  try{
    refs.content=store.doc("content");refs.tasks=store.doc("tasks");refs.dec=store.doc("decisions");refs.log=store.doc("log");
    refs.content.onSnapshot(d=>{if(d){if(d.v===CONTENT_V){C=JSON.parse(JSON.stringify(d));lsSet("ff_content",C);renderAll();}else if(canWrite&&!migrated){migrated=true;C=defaultContent();persist("content");toast("Cronograma atualizado para a estrutura nova");}}setSync(true,store.label);},()=>setSync(false,"Sem sincronização"));
    refs.tasks.onSnapshot(d=>{if(d&&d.tasks){S=Object.assign({},d.tasks);lsSet("ff_tasks",S);renderAll();}},()=>{});
    refs.dec.onSnapshot(d=>{if(d){DEC=Object.assign({},d);lsSet("ff_dec",DEC);renderImersao();if(cur!=="decisoes")renderDecisoes();$("#brandName").textContent=DEC.nome||"Família Forte — O Começo";}},()=>{});
    refs.log.onSnapshot(d=>{if(d&&d.items){LOG=d.items.slice();lsSet("ff_log",LOG);renderVisao();renderDecisoes();}},()=>{});
  }catch(e){setSync(false,"Só neste dispositivo");}
})();
</script>
